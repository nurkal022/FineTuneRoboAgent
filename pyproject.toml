[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-agency"
version = "0.1.0"
description = "Обучение LLM проактивной агентности для управления вербальным роботом"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.51",
    "trl>=0.15",
    "peft>=0.14",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
]
# Unsloth сам подтягивает совместимые версии transformers/trl и патчит их
# при импорте. Ставить его лучше отдельной командой, а не вместе с train,
# чтобы pip не разрешал конфликт версий вслепую — см. README.
unsloth = ["unsloth", "unsloth_zoo"]
serve = ["vllm>=0.8"]
dev = ["pytest>=8.0"]

[project.scripts]
robo-agency = "robo_agency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
