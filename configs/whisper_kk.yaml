# Дообучение Whisper на казахском.
#
# Точка отсчёта: Whisper без дообучения даёт на казахском WER около 77%,
# то есть практически неработоспособен. Опубликованные работы по дообучению
# на казахских данных сообщают WER порядка 14-15% и CER около 3.4%.
# Замер базы обязателен ДО обучения — иначе не с чем сравнивать.

# large-v3-turbo: 809 млн параметров, но декодер урезан до 4 слоёв вместо 32,
# поэтому он в разы быстрее large-v3 при близком качестве.
#
# Оговорка: turbo дистиллирован с упором на распространённые языки, и на
# низкоресурсных его исходное качество может быть ХУЖЕ, чем у large-v3.
# Для казахского это неизвестно заранее — покажет базовый замер. Если база
# окажется совсем плохой, есть запасной путь: openai/whisper-small.
model: openai/whisper-large-v3-turbo
language: kazakh
# turbo умеет только транскрибировать, перевода в нём нет.
task: transcribe

output_dir: outputs/whisper-kk

dataset:
  # FLEURS выбран из-за диска: на машине около 10 ГБ свободно, а KSC2
  # (1000+ часов) это сотни гигабайт. FLEURS kk_kz — порядка десяти часов.
  path: google/fleurs
  name: kk_kz
  train_split: train
  eval_split: validation
  # Автоопределение: у FLEURS это transcription, у Common Voice sentence.
  text_column: null
  audio_column: audio
  # Поток: аудио не оседает на диске целиком.
  streaming: true

# Энкодер заморожен. Он отвечает за акустику и уже силён многоязычно;
# переучивать под казахский надо письменность, то есть декодер. У turbo
# энкодер это около 79% параметров, так что обучается примерно 174 млн.
#
# Без заморозки состояния оптимизатора на 809 млн в 16 ГБ не помещаются.
freeze_encoder: true

# Восьмибитный Adam: 2 байта на параметр вместо 8. bitsandbytes уже стоит.
optim: adamw_bnb_8bit

# Осторожнее обычного: у turbo всего 4 слоя декодера, и на 1e-5 он
# разъезжается быстрее, чем успевает выучить орфографию.
learning_rate: 6.0e-6
warmup_steps: 50

# Шаги, а не эпохи: в потоковом режиме размер корпуса заранее неизвестен.
max_steps: 1500

per_device_batch_size: 4
gradient_accumulation_steps: 4

eval_steps: 250
save_steps: 500
save_total_limit: 2
logging_steps: 25

# Сколько примеров брать на замер. Больше — точнее, но каждый требует
# отдельной генерации, и замер начинает занимать заметное время.
eval_examples: 200

generation_max_length: 225
seed: 42
bf16: true
gradient_checkpointing: true
