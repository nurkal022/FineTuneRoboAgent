# Состав обучающего микса (раздел 6.5 спеки).
#
# Файл проактивности создаётся командой `make fetch`.
# Формат определяется автоматически; при промахе задайте format и field_map явно.

seed: 42
val_ratio: 0.05

# null = взять максимум, при котором ни один источник не дублируется.
# Ограничивает проактивность: после выравнивания классов её около 1000
# примеров, поэтому потолок всего корпуса — примерно 1800.
target_size: null

# Выравнивание ACT/WAIT прореживанием преобладающего класса.
# В исходных данных WAIT встречается вдвое чаще (1122 против 504), и без
# выравнивания модель приходит к вырожденной стратегии «молчать всегда».
proactivity_balance: true

proportions:
  # 0.55 = 50% проактивности + 5% негативных примеров. После выравнивания
  # негативы это половина класса WAIT, отдельным источником они не нужны.
  proactivity: 0.55
  function_calling: 0.20
  replay: 0.25

proactivity:
  - path: data/raw/proactive_bench.jsonl
    # format: proactive_agent   # задать явно, если автоопределение промахнётся

function_calling:
  # Срез в split скачивает меньше данных: из 60k нужно всего несколько сотен.
  - path: Salesforce/xlam-function-calling-60k
    split: train[:5000]

replay:
  - path: HuggingFaceH4/ultrachat_200k
    split: train_sft[:5000]
