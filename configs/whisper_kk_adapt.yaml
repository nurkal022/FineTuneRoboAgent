# Эксперимент 004: можно ли улучшить готовую казахскую модель нашими данными.
#
# Обучение идёт ПОВЕРХ уже дообученной модели, а не с нуля от базового turbo.
# С нуля мы заведомо проигрываем: FLEURS kk_kz это около десяти часов против
# сотен у KSC2, на которых обучена стартовая модель.
#
# Отправная точка (эксперимент 003, те же 100 записей validation):
#   shyngys879/kazakh-whisper-large-v3-turbo   WER 0.1142   CER 0.0387
#
# Вопрос эксперимента: сдвинутся ли эти числа. Полезен любой исход. Улучшение
# означает, что адаптация малыми данными работает поверх сильной модели.
# Отсутствие улучшения — измеренное обоснование того, что готовую модель надо
# брать как есть, а не догадка об этом.

model: shyngys879/kazakh-whisper-large-v3-turbo
language: kazakh
task: transcribe

output_dir: outputs/whisper-kk-adapt

dataset:
  path: google/fleurs
  name: kk_kz
  train_split: train
  eval_split: validation
  text_column: null
  audio_column: audio
  # Поле не используется: и обучение, и замер читают parquet напрямую.
  streaming: false

# Энкодер заморожен: акустику стартовая модель уже слышит хорошо, поправить
# надо письменность, то есть декодер. Плюс без заморозки не хватает памяти.
freeze_encoder: true
optim: adamw_bnb_8bit

# Втрое ниже, чем при обучении с нуля (6e-6). Стартовая модель уже хорошо
# настроена, и задача — сдвинуть её, а не переучить: на большом шаге она
# растеряет то, что выучила на сотнях часов.
learning_rate: 2.0e-6
warmup_steps: 30

# FLEURS kk_kz train — порядка 3000 записей. При эффективном батче 16
# это около 190 шагов на проход, то есть 400 шагов ≈ два прохода.
max_steps: 400

per_device_batch_size: 4
gradient_accumulation_steps: 4

eval_steps: 100
save_steps: 200
# Один чекпойнт: на диске около 6 ГБ, а полная модель весит 1.6 ГБ.
save_total_limit: 1
logging_steps: 20

# Замер по ходу обучения держим маленьким: каждая запись требует генерации.
eval_examples: 50

generation_max_length: 225
seed: 42
bf16: true
gradient_checkpointing: true
