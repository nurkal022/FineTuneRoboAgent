# Профиль DPO под RTX 5080 (16 ГБ).
#
# DPO тяжелее SFT по памяти: на каждом шаге считаются логвероятности и для
# обучаемой политики, и для опорной модели. Поэтому длины здесь ещё короче,
# чем в SFT-профиле.

# Тот же предквантованный вариант, что и в SFT-профиле.
base_model: unsloth/Qwen3-8B-unsloth-bnb-4bit
engine: unsloth

adapter_path: outputs/adapter-decisions
pairs_file: data/processed/preference_pairs.jsonl
output_dir: outputs/adapter-decisions-dpo

load_in_4bit: true

# Низкий lr намеренно: DPO на нескольких тысячах пар легко разрушает SFT.
learning_rate: 5.0e-6
beta: 0.1
num_epochs: 1.0

per_device_batch_size: 1
gradient_accumulation_steps: 16

max_length: 2048
max_prompt_length: 1536

logging_steps: 10
seed: 42
bf16: true
gradient_checkpointing: true
